# .worktrees.toml — per-project setup for the `worktrees` tool. COMMITTED:
# this is project structure, like docker-compose.yml, not per-machine state.
#
# Generated by `worktrees init` from what this repo looks like today. Nothing
# below was inferred with certainty — read it, delete what does not apply.
# Every path is repo-relative; absolute paths, `~`, `$` and `.git` are refused.

# ── files ─────────────────────────────────────────────────────────────────
# No gitignored credential file was found in this checkout. When one appears,
# declare it here so every worktree gets it:
#
# [[file]]
# path = ".env"

# ── ports ─────────────────────────────────────────────────────────────────
# Port isolation. Stands alone — no docker required. Each place takes the
# lowest free slot k, and every port below becomes base + stride*k. The
# numbers are written to <worktree>/.worktree.env, which the tool owns and
# your scripts source. Run `worktrees provision --all` after editing this.
# Read out of docker-compose.yml.
# ⚠ The NAMES matter as much as the numbers: each is emitted as <NAME>_PORT
# (PG = 5432 → PG_PORT), and these are that file's SERVICE names, which are
# rarely what a script reads. Rename each to the variable your scripts DO
# read: a key nothing reads is written, ignored, and the script falls back
# to its own default — which is main's port. Nothing errors, they collide.
[ports]
stride = 100
max_slots = 50
base = { WHATSAPP_GO = 3000 }
